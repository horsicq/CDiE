name: Build and publish Beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-deps:
    runs-on: ubuntu-24.04
    outputs:
      xxfclib: ${{ steps.revisions.outputs.xxfclib }}
      cdisasm: ${{ steps.revisions.outputs.cdisasm }}
      xxwidgets: ${{ steps.revisions.outputs.xxwidgets }}
      detect_it_easy: ${{ steps.revisions.outputs.detect_it_easy }}
    steps:
      - name: Resolve dependency revisions
        id: revisions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          script: |
            const repositories = {
              xxfclib: 'xxfclib',
              cdisasm: 'cdisasm',
              xxwidgets: 'xxwidgets',
              detect_it_easy: 'Detect-It-Easy',
            };
            for (const [output, repo] of Object.entries(repositories)) {
              const { data: repository } = await github.rest.repos.get({ owner: 'horsicq', repo });
              const { data: commit } = await github.rest.repos.getCommit({
                owner: 'horsicq', repo, ref: repository.default_branch,
              });
              core.setOutput(output, commit.sha);
              core.info(`${repo}: ${commit.sha}`);
            }

  ubuntu:
    needs: resolve-deps
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cdie
        uses: actions/checkout@v4
        with:
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake unzip
      - name: Configure
        working-directory: cdie
        run: |
          test -d dep/Detect-It-Easy/db
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DXXFCLIB_DIR="$PWD/dep/xxfclib" \
            -DXXFC_CDISASM_DIR="$PWD/dep/cdisasm" \
            -DCDIE_DATABASE_DIR="$PWD/dep/Detect-It-Easy"
      - name: Build
        working-directory: cdie
        run: cmake --build build --parallel 2
      - name: Package Ubuntu
        working-directory: cdie
        run: |
          version=$(head -n 1 release_version.txt)
          cpack --config build/CPackConfig.cmake -G ZIP -B release \
            -D "CPACK_PACKAGE_FILE_NAME=cdie_ubuntu24_amd64_${version}"
          archive="release/cdie_ubuntu24_amd64_${version}.zip"
          test -s "$archive"
          unzip -Z -1 "$archive" | grep -Eq '(^|/)bin/cdie$'
          unzip -Z -1 "$archive" | grep -Eq '(^|/)bin/db/.+[^/]$'
      - name: Save Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-ubuntu24
          path: cdie/release/cdie_ubuntu24_amd64_*.zip
          if-no-files-found: error

  macos:
    needs: resolve-deps
    runs-on: macos-15
    steps:
      - name: Check out cdie
        uses: actions/checkout@v4
        with:
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Configure
        working-directory: cdie
        run: |
          test "$(uname -m)" = arm64
          test -d dep/Detect-It-Easy/db
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DXXFCLIB_DIR="$PWD/dep/xxfclib" \
            -DXXFC_CDISASM_DIR="$PWD/dep/cdisasm" \
            -DCDIE_DATABASE_DIR="$PWD/dep/Detect-It-Easy"
      - name: Build
        working-directory: cdie
        run: cmake --build build --parallel 2
      - name: Package and verify macOS
        working-directory: cdie
        run: |
          version=$(head -n 1 release_version.txt)
          cpack --config build/CPackConfig.cmake -G ZIP -B release
          archive="release/cdie_mac_arm64_portable_${version}.zip"
          test -s "$archive"

          extract_dir=$(mktemp -d)
          unzip -q "$archive" -d "$extract_dir"
          package_dir="$extract_dir/cdie_mac_arm64_portable_${version}"
          test -x "$package_dir/cdie"
          test -n "$(find "$package_dir/db" -type f -print -quit)"

          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          "$package_dir/cdie" /usr/bin/file > scan.txt
          test -s scan.txt
      - name: Save macOS package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-macos-arm64
          path: cdie/release/cdie_mac_arm64_portable_*.zip
          if-no-files-found: error

  windows:
    needs: resolve-deps
    runs-on: windows-2022
    steps:
      - name: Check out cdie
        uses: actions/checkout@v4
        with:
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Build and package Windows
        shell: cmd
        working-directory: cdie
        env:
          CDIE_DATABASE_DIR: ${{ github.workspace }}\cdie\dep\Detect-It-Easy
        run: call packaging\windows\build_portable_windows.cmd x64 win64
      - name: Verify Windows package
        shell: pwsh
        working-directory: cdie
        run: |
          $packages = @(Get-ChildItem release -Filter 'cdie_win_x64_portable_*.zip')
          if ($packages.Count -ne 1) { throw "Expected one Windows ZIP, found $($packages.Count)" }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            if (-not ($entries | Where-Object { $_ -match '(^|/)cdie\.exe$' })) {
              throw 'Windows package is missing cdie.exe'
            }
            if (-not ($entries | Where-Object { $_ -match '(^|/)db/.+[^/]$' })) {
              throw 'Windows package is missing the signature database'
            }
          } finally {
            $archive.Dispose()
          }
      - name: Save Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-win64
          path: cdie/release/cdie_win_x64_portable_*.zip
          if-no-files-found: error

  publish-beta:
    if: github.ref == 'refs/heads/main'
    needs: [resolve-deps, ubuntu, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: cdie-beta-publish
      cancel-in-progress: false
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: cdie-*
          merge-multiple: true
          path: release-assets
      - name: Verify packages and current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_ubuntu24_amd64_*.zip' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_mac_arm64_portable_*.zip' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_win_x64_portable_*.zip' | wc -l)" -eq 1
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA"
      - name: Point Beta tag at packaged commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const main = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.data.object.sha !== context.sha) {
              throw new Error('main moved before the Beta release was uploaded');
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'tags/Beta' });
              await github.rest.git.updateRef({
                owner, repo, ref: 'tags/Beta', sha: context.sha, force: true,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/tags/Beta', sha: context.sha,
              });
            }
      - name: Upload to Beta release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta
          name: Beta
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*.zip
          body: |
            cdie commit: ${{ github.sha }}
            xxfclib: ${{ needs.resolve-deps.outputs.xxfclib }}
            cdisasm: ${{ needs.resolve-deps.outputs.cdisasm }}
            xxwidgets: ${{ needs.resolve-deps.outputs.xxwidgets }}
            Detect-It-Easy: ${{ needs.resolve-deps.outputs.detect_it_easy }}
