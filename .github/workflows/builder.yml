name: Build and publish Beta

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_build:
        description: Build packages for make_release.yml without updating Beta
        type: boolean
        required: false
        default: false
    outputs:
      xxfclib:
        description: Dependency revision used by every platform
        value: ${{ jobs.resolve-deps.outputs.xxfclib }}
      cdisasm:
        description: Dependency revision used by every platform
        value: ${{ jobs.resolve-deps.outputs.cdisasm }}
      xxwidgets:
        description: Dependency revision used by every platform
        value: ${{ jobs.resolve-deps.outputs.xxwidgets }}
      detect_it_easy:
        description: Dependency revision used by every platform
        value: ${{ jobs.resolve-deps.outputs.detect_it_easy }}
      xxnetlib:
        description: Dependency revision used by every platform
        value: ${{ jobs.resolve-deps.outputs.xxnetlib }}
      xxgithub:
        description: Dependency revision used by every platform
        value: ${{ jobs.resolve-deps.outputs.xxgithub }}
    secrets:
      CDIE_DEPS_TOKEN:
        description: Optional token for dependency checkouts
        required: false

permissions:
  contents: read

jobs:
  resolve-deps:
    runs-on: ubuntu-24.04
    outputs:
      xxfclib: ${{ steps.revisions.outputs.xxfclib }}
      cdisasm: ${{ steps.revisions.outputs.cdisasm }}
      xxwidgets: ${{ steps.revisions.outputs.xxwidgets }}
      detect_it_easy: ${{ steps.revisions.outputs.detect_it_easy }}
      xxnetlib: ${{ steps.revisions.outputs.xxnetlib }}
      xxgithub: ${{ steps.revisions.outputs.xxgithub }}
    steps:
      - name: Resolve dependency revisions
        id: revisions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          script: |
            const repositories = {
              xxfclib: 'xxfclib',
              cdisasm: 'cdisasm',
              xxwidgets: 'xxwidgets',
              detect_it_easy: 'Detect-It-Easy',
            };
            for (const [output, repo] of Object.entries(repositories)) {
              const { data: repository } = await github.rest.repos.get({ owner: 'horsicq', repo });
              const { data: commit } = await github.rest.repos.getCommit({
                owner: 'horsicq', repo, ref: repository.default_branch,
              });
              core.setOutput(output, commit.sha);
              core.info(`${repo}: ${commit.sha}`);
            }
            // die-update and the GUI's Update database need xxnetlib and
            // xxgithub. While they are not published (or the token cannot
            // read them) the output stays empty, the checkouts below are
            // skipped and CMake builds the packages without the updater.
            const optional = {
              xxnetlib: 'xxnetlib',
              xxgithub: 'xxgithub',
            };
            for (const [output, repo] of Object.entries(optional)) {
              try {
                const { data: repository } = await github.rest.repos.get({ owner: 'horsicq', repo });
                const { data: commit } = await github.rest.repos.getCommit({
                  owner: 'horsicq', repo, ref: repository.default_branch,
                });
                core.setOutput(output, commit.sha);
                core.info(`${repo}: ${commit.sha}`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.setOutput(output, '');
                core.warning(`${repo} is not available: the packages are built without die-update`);
              }
            }

  ubuntu:
    needs: resolve-deps
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cdie
        uses: actions/checkout@v4
        with:
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxnetlib
        if: needs.resolve-deps.outputs.xxnetlib != ''
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxnetlib
          ref: ${{ needs.resolve-deps.outputs.xxnetlib }}
          path: cdie/dep/xxnetlib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxgithub
        if: needs.resolve-deps.outputs.xxgithub != ''
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxgithub
          ref: ${{ needs.resolve-deps.outputs.xxgithub }}
          path: cdie/dep/xxgithub
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake unzip pkg-config libgtk-3-dev
      - name: Configure
        working-directory: cdie
        run: |
          test -d dep/Detect-It-Easy/db
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DXXFCLIB_DIR="$PWD/dep/xxfclib" \
            -DXXFC_CDISASM_DIR="$PWD/dep/cdisasm" \
            -DCDIE_DATABASE_DIR="$PWD/dep/Detect-It-Easy"
      - name: Build
        working-directory: cdie
        run: cmake --build build --parallel 2
      - name: Package Ubuntu
        working-directory: cdie
        env:
          WITH_UPDATER: ${{ needs.resolve-deps.outputs.xxnetlib != '' && needs.resolve-deps.outputs.xxgithub != '' }}
        run: |
          version=$(head -n 1 release_version.txt)
          cpack --config build/CPackConfig.cmake -G ZIP -B release \
            -D "CPACK_PACKAGE_FILE_NAME=cdie_ubuntu24_amd64_${version}"
          archive="release/cdie_ubuntu24_amd64_${version}.zip"
          test -s "$archive"
          inventory=$(mktemp)
          unzip -Z -1 "$archive" > "$inventory"
          grep -Eq '(^|/)bin/diec$' "$inventory"
          grep -Eq '(^|/)bin/die$' "$inventory"
          grep -Eq '(^|/)bin/db/.+[^/]$' "$inventory"
          if [ "$WITH_UPDATER" = true ]; then
            grep -Eq '(^|/)bin/die-update$' "$inventory"
          fi
          if grep -Eq '(^|/)(cdie_tui|cdie_gui|cdie)$' "$inventory"; then
            echo 'Unexpected legacy frontend in Ubuntu package' >&2
            exit 1
          fi
      - name: Save Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-ubuntu24
          path: cdie/release/cdie_ubuntu24_amd64_*.zip
          if-no-files-found: error

  # The .deb and the AppImage come from the oldest supported Ubuntu: glibc
  # (and, for the .deb, the dpkg-shlibdeps version floors) set the oldest
  # system each one runs on. A .deb built here also installs on 24.04 and
  # newer, whose t64 libraries Provide the pre-t64 names it depends on.
  linux-packages:
    needs: resolve-deps
    runs-on: ubuntu-22.04
    steps:
      - name: Check out cdie
        uses: actions/checkout@v4
        with:
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxnetlib
        if: needs.resolve-deps.outputs.xxnetlib != ''
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxnetlib
          ref: ${{ needs.resolve-deps.outputs.xxnetlib }}
          path: cdie/dep/xxnetlib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxgithub
        if: needs.resolve-deps.outputs.xxgithub != ''
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxgithub
          ref: ${{ needs.resolve-deps.outputs.xxgithub }}
          path: cdie/dep/xxgithub
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev dpkg-dev file
      # One FHS build tree (CDIE_BUILD_DIR) serves both packages.
      - name: Build Debian package
        working-directory: cdie
        env:
          CDIE_DATABASE_DIR: ${{ github.workspace }}/cdie/dep/Detect-It-Easy
          CDIE_BUILD_DIR: ${{ runner.temp }}/cdie-fhs
          CDIE_RELEASE_DIR: ${{ github.workspace }}/cdie/release
        run: |
          test -d dep/Detect-It-Easy/db
          bash packaging/debian/build_deb.sh \
            -DXXFCLIB_DIR="$PWD/dep/xxfclib" \
            -DXXFC_CDISASM_DIR="$PWD/dep/cdisasm"
      - name: Verify Debian package
        working-directory: cdie
        env:
          WITH_UPDATER: ${{ needs.resolve-deps.outputs.xxnetlib != '' && needs.resolve-deps.outputs.xxgithub != '' }}
        run: |
          version=$(head -n 1 release_version.txt)
          package="release/cdie_${version}_amd64.deb"
          test -s "$package"
          dpkg-deb -I "$package"
          dpkg-deb -f "$package" Depends | grep -q 'libgtk-3-0'
          dpkg-deb -f "$package" Conflicts | grep -q 'detectiteasy'
          root=$(mktemp -d)
          dpkg-deb -x "$package" "$root"
          # The bin/ links are relative, so they resolve inside the extracted
          # tree, and the programs find the databases beside their real path.
          "$root/usr/bin/diec" --version
          "$root/usr/bin/diec" "$root/usr/lib/cdie/diec"
          test -s "$root/usr/share/icons/hicolor/256x256/apps/io.github.horsicq.cdie.png"
          test -s "$root/usr/share/metainfo/io.github.horsicq.cdie.metainfo.xml"
          if [ "$WITH_UPDATER" = true ]; then
            dpkg-deb -f "$package" Depends | grep -q 'libcurl'
            "$root/usr/bin/die-update" --version
          fi
      - name: Build AppImage
        working-directory: cdie
        env:
          CDIE_DATABASE_DIR: ${{ github.workspace }}/cdie/dep/Detect-It-Easy
          CDIE_BUILD_DIR: ${{ runner.temp }}/cdie-fhs
          CDIE_RELEASE_DIR: ${{ github.workspace }}/cdie/release
        run: |
          bash packaging/appimage/build_appimage.sh \
            -DXXFCLIB_DIR="$PWD/dep/xxfclib" \
            -DXXFC_CDISASM_DIR="$PWD/dep/cdisasm"
      - name: Verify AppImage
        working-directory: cdie
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          WITH_UPDATER: ${{ needs.resolve-deps.outputs.xxnetlib != '' && needs.resolve-deps.outputs.xxgithub != '' }}
        run: |
          version=$(head -n 1 release_version.txt)
          image="$PWD/release/cdie_${version}_x86_64.AppImage"
          test -x "$image"
          work=$(mktemp -d)
          cd "$work"
          "$image" diec --version
          "$image" diec "$image"
          if [ "$WITH_UPDATER" = true ]; then
            "$image" die-update --version
          fi
      - name: Save Debian package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-linux-deb
          path: cdie/release/cdie_*_amd64.deb
          if-no-files-found: error
      - name: Save AppImage
        uses: actions/upload-artifact@v4
        with:
          name: cdie-linux-appimage
          path: cdie/release/cdie_*_x86_64.AppImage
          if-no-files-found: error

  windows:
    needs: resolve-deps
    runs-on: windows-2022
    steps:
      - name: Check out cdie
        uses: actions/checkout@v4
        with:
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxnetlib
        if: needs.resolve-deps.outputs.xxnetlib != ''
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxnetlib
          ref: ${{ needs.resolve-deps.outputs.xxnetlib }}
          path: cdie/dep/xxnetlib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxgithub
        if: needs.resolve-deps.outputs.xxgithub != ''
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxgithub
          ref: ${{ needs.resolve-deps.outputs.xxgithub }}
          path: cdie/dep/xxgithub
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Build and package Windows
        shell: cmd
        working-directory: cdie
        env:
          CDIE_DATABASE_DIR: ${{ github.workspace }}\cdie\dep\Detect-It-Easy
        run: call packaging\windows\build_portable_windows.cmd x64 win64
      - name: Verify Windows package
        shell: pwsh
        working-directory: cdie
        env:
          WITH_UPDATER: ${{ needs.resolve-deps.outputs.xxnetlib != '' && needs.resolve-deps.outputs.xxgithub != '' }}
        run: |
          $packages = @(Get-ChildItem release -Filter 'cdie_win_x64_portable_*.zip')
          if ($packages.Count -ne 1) { throw "Expected one Windows ZIP, found $($packages.Count)" }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            $applications = @('die.exe', 'diec.exe')
            if ($env:WITH_UPDATER -eq 'true') { $applications += 'die-update.exe' }
            foreach ($application in $applications) {
              $escapedName = [regex]::Escape($application)
              if (-not ($entries | Where-Object { $_ -match "(^|/)$escapedName`$" })) {
                throw "Windows package is missing $application"
              }
            }
            if ($entries | Where-Object { $_ -match '(^|/)(cdie_gui|cdie|cdie_tui|diex)\.exe$' }) {
              throw 'Windows package contains a legacy frontend'
            }
            $portable = @($archive.Entries | Where-Object { $_.FullName -match '(^|/)PORTABLE$' })
            if ($portable.Count -ne 1 -or $portable[0].Length -ne 0) {
              throw 'Windows package requires one empty PORTABLE marker'
            }
            if (-not ($entries | Where-Object { $_ -match '(^|/)db/.+[^/]$' })) {
              throw 'Windows package is missing the signature database'
            }
          } finally {
            $archive.Dispose()
          }
      - name: Save Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-win64
          path: cdie/release/cdie_win_x64_portable_*.zip
          if-no-files-found: error

  publish-beta:
    if: github.ref == 'refs/heads/master' && !inputs.release_build
    needs: [resolve-deps, ubuntu, linux-packages, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: cdie-beta-publish
      cancel-in-progress: false
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: cdie-*
          merge-multiple: true
          path: release-assets
      - name: Verify packages and current master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_ubuntu24_amd64_*.zip' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_win_x64_portable_*.zip' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_*_amd64.deb' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_*_x86_64.AppImage' | wc -l)" -eq 1
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA"
      - name: Point Beta tag at packaged commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const master = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' });
            if (master.data.object.sha !== context.sha) {
              throw new Error('master moved before the Beta release was uploaded');
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'tags/Beta' });
              await github.rest.git.updateRef({
                owner, repo, ref: 'tags/Beta', sha: context.sha, force: true,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/tags/Beta', sha: context.sha,
              });
            }
      - name: Upload to Beta release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta
          name: Beta
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/cdie_ubuntu24_amd64_*.zip
            release-assets/cdie_win_x64_portable_*.zip
            release-assets/cdie_*_amd64.deb
            release-assets/cdie_*_x86_64.AppImage
          body: |
            cdie commit: ${{ github.sha }}
            xxfclib: ${{ needs.resolve-deps.outputs.xxfclib }}
            cdisasm: ${{ needs.resolve-deps.outputs.cdisasm }}
            xxwidgets: ${{ needs.resolve-deps.outputs.xxwidgets }}
            Detect-It-Easy: ${{ needs.resolve-deps.outputs.detect_it_easy }}
            xxnetlib: ${{ needs.resolve-deps.outputs.xxnetlib || 'not available (no die-update)' }}
            xxgithub: ${{ needs.resolve-deps.outputs.xxgithub || 'not available (no die-update)' }}
