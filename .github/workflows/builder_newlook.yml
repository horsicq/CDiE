name: Build NewLook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-deps:
    runs-on: ubuntu-24.04
    outputs:
      cdie: ${{ steps.revisions.outputs.cdie }}
      xxfclib: ${{ steps.revisions.outputs.xxfclib }}
      cdisasm: ${{ steps.revisions.outputs.cdisasm }}
      xxwidgets: ${{ steps.revisions.outputs.xxwidgets }}
      detect_it_easy: ${{ steps.revisions.outputs.detect_it_easy }}
    steps:
      - name: Resolve NewLook and dependency revisions
        id: revisions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          script: |
            const { data: source } = await github.rest.repos.getCommit({
              ...context.repo, ref: 'heads/NewLook',
            });
            core.setOutput('cdie', source.sha);
            core.info(`NewLook: ${source.sha}`);
            const repositories = {
              xxfclib: 'xxfclib',
              cdisasm: 'cdisasm',
              xxwidgets: 'xxwidgets',
              detect_it_easy: 'Detect-It-Easy',
            };
            for (const [output, repo] of Object.entries(repositories)) {
              const { data: repository } = await github.rest.repos.get({ owner: 'horsicq', repo });
              const { data: commit } = await github.rest.repos.getCommit({
                owner: 'horsicq', repo, ref: repository.default_branch,
              });
              core.setOutput(output, commit.sha);
              core.info(`${repo}: ${commit.sha}`);
            }

  ubuntu:
    needs: resolve-deps
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cdie NewLook
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deps.outputs.cdie }}
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake unzip pkg-config libgtk-3-dev
      - name: Configure
        working-directory: cdie
        run: |
          test -d dep/Detect-It-Easy/db
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DXXFCLIB_DIR="$PWD/dep/xxfclib" \
            -DXXFC_CDISASM_DIR="$PWD/dep/cdisasm" \
            -DCDIE_DATABASE_DIR="$PWD/dep/Detect-It-Easy"
      - name: Build
        working-directory: cdie
        run: cmake --build build --parallel 2
      - name: Package Ubuntu
        working-directory: cdie
        run: |
          version=$(head -n 1 release_version.txt)
          cpack --config build/CPackConfig.cmake -G ZIP -B release \
            -D "CPACK_PACKAGE_FILE_NAME=cdie_ubuntu24_amd64_${version}"
          archive="release/cdie_ubuntu24_amd64_${version}.zip"
          test -s "$archive"
          inventory=$(mktemp)
          unzip -Z -1 "$archive" > "$inventory"
          grep -Eq '(^|/)bin/cdie$' "$inventory"
          grep -Eq '(^|/)bin/db/.+[^/]$' "$inventory"
      - name: Save Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-newlook-ubuntu24
          path: cdie/release/cdie_ubuntu24_amd64_*.zip
          if-no-files-found: error

  macos:
    needs: resolve-deps
    runs-on: macos-15
    steps:
      - name: Check out cdie NewLook
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deps.outputs.cdie }}
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Build macOS
        working-directory: cdie
        env:
          NO_RUN: "1"
          EXTRA_CMAKE_ARGS: -DXXFC_CDISASM_DIR=${{ github.workspace }}/cdie/dep/cdisasm
        run: |
          test "$(uname -m)" = arm64
          test -d dep/Detect-It-Easy/db
          chmod +x run/macos.sh
          ./run/macos.sh
          test -x build_macos/cdie_gui
      - name: Package and verify macOS
        working-directory: cdie
        run: |
          version=$(head -n 1 release_version.txt)
          name="cdie_mac_arm64_portable_${version}"
          mkdir -p "release/$name"
          cp build_macos/cdie_gui "release/$name/cdie"
          cp -R dep/Detect-It-Easy/db "release/$name/db"
          [ -d dep/Detect-It-Easy/db_extra ]  && cp -R dep/Detect-It-Easy/db_extra  "release/$name/db_extra"
          [ -d dep/Detect-It-Easy/db_custom ] && cp -R dep/Detect-It-Easy/db_custom "release/$name/db_custom"
          (cd release && ditto -c -k --keepParent "$name" "$name.zip")
          test -s "release/$name.zip"
          extract_dir=$(mktemp -d)
          unzip -q "release/$name.zip" -d "$extract_dir"
          test -x "$extract_dir/$name/cdie"
          test -n "$(find "$extract_dir/$name/db" -type f -print -quit)"
      - name: Save macOS package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-newlook-macos-arm64
          path: cdie/release/cdie_mac_arm64_portable_*.zip
          if-no-files-found: error

  windows:
    needs: resolve-deps
    runs-on: windows-2022
    steps:
      - name: Check out cdie NewLook
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deps.outputs.cdie }}
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Build and package Windows
        shell: cmd
        working-directory: cdie
        env:
          CDIE_DATABASE_DIR: ${{ github.workspace }}\cdie\dep\Detect-It-Easy
        run: call run\build_portable_windows.cmd x64 win_x64
      - name: Verify Windows package
        shell: pwsh
        working-directory: cdie
        run: |
          $packages = @(Get-ChildItem release -Filter 'cdie_win_x64_portable_*.zip')
          if ($packages.Count -ne 1) { throw "Expected one Windows ZIP, found $($packages.Count)" }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($application in @('cdie.exe', 'cdie_gui.exe')) {
              $escapedName = [regex]::Escape($application)
              if (-not ($entries | Where-Object { $_ -match "(^|/)$escapedName`$" })) {
                throw "Windows package is missing $application"
              }
            }
            if (-not ($entries | Where-Object { $_ -match '(^|/)db/.+[^/]$' })) {
              throw 'Windows package is missing the signature database'
            }
          } finally {
            $archive.Dispose()
          }
      - name: Save Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-newlook-win64
          path: cdie/release/cdie_win_x64_portable_*.zip
          if-no-files-found: error

  windows-setup:
    needs: resolve-deps
    runs-on: windows-2022
    steps:
      - name: Check out cdie NewLook
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deps.outputs.cdie }}
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Build and package Windows setup
        shell: cmd
        working-directory: cdie
        env:
          CDIE_DATABASE_DIR: ${{ github.workspace }}\cdie\dep\Detect-It-Easy
        run: call run\build_installer.cmd
      - name: Verify Windows setup
        shell: pwsh
        working-directory: cdie
        run: |
          $setups = @(Get-ChildItem release -Filter 'cdie-setup*.exe')
          if ($setups.Count -ne 1) { throw "Expected one setup exe, found $($setups.Count)" }
          if ($setups[0].Length -lt 1MB) { throw "Setup exe is suspiciously small" }
      - name: Save Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: cdie-newlook-win64-setup
          path: cdie/release/cdie-setup*.exe
          if-no-files-found: error

  publish-newlook:
    needs: [resolve-deps, ubuntu, macos, windows, windows-setup]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: cdie-newlook-publish
      cancel-in-progress: false
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: cdie-newlook-*
          merge-multiple: true
          path: release-assets
      - name: Verify packages
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_ubuntu24_amd64_*.zip' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_mac_arm64_portable_*.zip' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie_win_x64_portable_*.zip' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'cdie-setup*.exe' | wc -l)" -eq 1
      - name: Rename packages for NewLook
        run: |
          cd release-assets
          for f in cdie_win_x64_portable_*.zip; do
            mv "$f" "${f/cdie_win_x64_portable_/cdie_newlook_win_x64_portable_}"
          done
          for f in cdie_ubuntu24_amd64_*.zip; do
            mv "$f" "${f/cdie_ubuntu24_amd64_/cdie_newlook_ubuntu24_amd64_}"
          done
          for f in cdie_mac_arm64_portable_*.zip; do
            mv "$f" "${f/cdie_mac_arm64_portable_/cdie_newlook_mac_arm64_portable_}"
          done
          ls -l
      - name: Point NewLook-Beta tag at packaged commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = '${{ needs.resolve-deps.outputs.cdie }}';
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'tags/NewLook-Beta' });
              await github.rest.git.updateRef({
                owner, repo, ref: 'tags/NewLook-Beta', sha, force: true,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/tags/NewLook-Beta', sha,
              });
            }
      - name: Upload to NewLook-Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: NewLook-Beta
          name: NewLook Beta
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            cdie NewLook commit: ${{ needs.resolve-deps.outputs.cdie }}
            xxfclib: ${{ needs.resolve-deps.outputs.xxfclib }}
            cdisasm: ${{ needs.resolve-deps.outputs.cdisasm }}
            xxwidgets: ${{ needs.resolve-deps.outputs.xxwidgets }}
            Detect-It-Easy: ${{ needs.resolve-deps.outputs.detect_it_easy }}
